# Remote server overrides. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Auth is enabled: log in as cassandra/cassandra on first start, then change the password (see README).
services:
  cassandra:
    restart: unless-stopped
    ports:
      # Bind to a specific interface (default: localhost only). Set CASSANDRA_BIND
      # to the server's private IP to allow other hosts, and firewall port 9042.
      - "${CASSANDRA_BIND:-127.0.0.1}:9042:9042"
    environment:
      MAX_HEAP_SIZE: ${CASSANDRA_MAX_HEAP_SIZE:-2G}
      HEAP_NEWSIZE: ${CASSANDRA_HEAP_NEWSIZE:-512M}
      CASSANDRA_ENABLE_AUTH: "true"
    # The image has no environment variables for authentication, so this script
    # edits cassandra.yaml before starting Cassandra.
    command: ["bash", "/usr/local/bin/mlw-cassandra-configure.sh"]
    volumes:
      - ./docker/cassandra/configure.sh:/usr/local/bin/mlw-cassandra-configure.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "nodetool statusbinary | grep -q running"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  app:
    restart: unless-stopped
    depends_on:
      cassandra:
        condition: service_healthy
    environment:
      # anyone who can reach the port can change data, so a token is required
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env}
      # login with Keycloak; the API token still works for scripts
      OIDC_ISSUER: ${KEYCLOAK_HOSTNAME:?set KEYCLOAK_HOSTNAME in .env}/realms/mlw
      OIDC_JWKS_URL: http://keycloak:8080/realms/mlw/protocol/openid-connect/certs
      # the cassandra service above has authentication on; see the README for the first-time login
      CASSANDRA_USERNAME: ${CASSANDRA_USERNAME:-cassandra}
      CASSANDRA_PASSWORD: ${CASSANDRA_PASSWORD:-cassandra}

  # Keycloak in production mode, with PostgreSQL. It serves plain HTTP on the
  # port above, so put a reverse proxy that terminates HTTPS in front of it and
  # set KEYCLOAK_HOSTNAME to the public URL (for example https://id.example.org).
  keycloak:
    restart: unless-stopped
    command: ["start", "--http-enabled=true", "--proxy-headers=xforwarded", "--import-realm"]
    depends_on:
      keycloak-db:
        condition: service_healthy
    volumes:
      # realm "mlw" with the client mlw-app, without users: create them in the admin console
      - ./docker/keycloak/mlw-realm.json:/opt/keycloak/data/import/mlw-realm.json:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:?set KEYCLOAK_HOSTNAME in .env}
      # the realm file lists this URL as the address of the app
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?set APP_PUBLIC_URL in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}

  keycloak-db:
    image: postgres:16
    container_name: mlw-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  keycloak_db_data:
