# Base configuration shared by all environments.
# Local dev:  docker compose up -d                (adds docker-compose.override.yml automatically)
# Remote:     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  cassandra:
    image: cassandra:5.0
    container_name: mlw-cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: ${CASSANDRA_CLUSTER_NAME:-mlw-cluster}
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: ${CASSANDRA_MAX_HEAP_SIZE:-512M}
      HEAP_NEWSIZE: ${CASSANDRA_HEAP_NEWSIZE:-128M}
    volumes:
      - cassandra_data:/var/lib/cassandra

  # REST API and web UI for the database. It uses the cassandra service above by
  # default (the overrides make it wait for that service). To use a remote
  # Cassandra instead, set CASSANDRA_HOSTS and the credentials in .env and run
  # only this service, from the base file alone so nothing local is started:
  #   docker compose -f docker-compose.yml up -d app
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: mlw-app:latest
    container_name: mlw-app
    environment:
      CASSANDRA_HOSTS: ${CASSANDRA_HOSTS:-cassandra}
      CASSANDRA_PORT: ${CASSANDRA_PORT:-9042}
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-mlw}
      CASSANDRA_USERNAME: ${CASSANDRA_USERNAME:-}
      CASSANDRA_PASSWORD: ${CASSANDRA_PASSWORD:-}
      CASSANDRA_LOCAL_DC: ${CASSANDRA_LOCAL_DC:-}
      CASSANDRA_CONSISTENCY: ${CASSANDRA_CONSISTENCY:-LOCAL_QUORUM}
      CASSANDRA_TLS: ${CASSANDRA_TLS:-false}
      CASSANDRA_TLS_SKIP_VERIFY: ${CASSANDRA_TLS_SKIP_VERIFY:-false}
      CASSANDRA_DISABLE_INITIAL_HOST_LOOKUP: ${CASSANDRA_DISABLE_INITIAL_HOST_LOOKUP:-false}
      CASSANDRA_IGNORE_PEER_ADDR: ${CASSANDRA_IGNORE_PEER_ADDR:-false}
      APPLY_SCHEMA: ${APPLY_SCHEMA:-false}
      API_TOKEN: ${API_TOKEN:-}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8090}:8080"

  # Keycloak identity and access management (keycloak.org). It is not wired to
  # the app yet: it runs next to it so realms, clients and users can be set up.
  # Local dev (override file): start-dev with an embedded H2 database.
  # Remote (prod file): production mode with a PostgreSQL database.
  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.4.0}
    container_name: mlw-keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - keycloak_data:/opt/keycloak/data
    ports:
      # 8080 inside the container; 8180 on the host so it does not clash with the app's dev port
      - "${KEYCLOAK_BIND:-127.0.0.1}:${KEYCLOAK_PORT:-8180}:8080"

volumes:
  cassandra_data:
  keycloak_data:
