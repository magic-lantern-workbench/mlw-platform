# Local development overrides (loaded automatically by `docker compose up`).
services:
  cassandra:
    restart: "no"
    ports:
      - "127.0.0.1:9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  keycloak:
    restart: "no"
    command: ["start-dev"]

  app:
    restart: "no"
    depends_on:
      cassandra:
        condition: service_healthy
    environment:
      # the local database starts empty, so let the app create the schema
      APPLY_SCHEMA: ${APPLY_SCHEMA:-true}
