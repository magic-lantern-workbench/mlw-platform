          nullable: true
        scene_id:
          type: string
          description: Scene of the frame this entry points at (frame.scene_id).
          nullable: true
        shot_id:
          type: string
          description: Shot of the frame this entry points at (frame.shot_id).
          nullable: true
        frame_number:
          type: integer
          format: int32
          description: Number of the frame this entry points at (frame.frame_number). The entry covers all layers of that frame.
          nullable: true
      example:
        project_id: demo
        timeline_id: TIMELINE1
        position: 10
        name: Example
        description: Example description.
        sequence_id: SQ010
        scene_id: SC010
        shot_id: SH010
