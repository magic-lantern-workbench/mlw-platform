    Timeline:
      type: object
      description: A timeline is an ordered sequence of frames. The table has one row per entry, partitioned by timeline and ordered by position. Each entry points at a frame by its sequence, scene, shot and frame number.
      required:
        - project_id
        - timeline_id
        - position
      properties:
        project_id:
          type: string
          description: Identifier of the project the row belongs to (project.project_id).
