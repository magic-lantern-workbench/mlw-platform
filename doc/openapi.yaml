components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Required only when the server is started with API_TOKEN.
  responses:
    BadRequest:
      description: "The request cannot be used: invalid JSON, an unknown column, a value of the wrong type, a missing key column, the wrong number of key values, or an invalid limit or pageState."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: bad_request
              message: "frame_rate: expected a number"
    Unauthorized:
      description: The bearer token is missing or wrong.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthorized
              message: missing or invalid bearer token
    NotFound:
      description: No such table, or no row has the key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_found
              message: no row with this key
    ReadOnly:
      description: The table is a lookup table maintained by the API and cannot be written directly.
      headers:
        Allow:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: read_only
              message: this table is maintained automatically and cannot be written directly
    Conflict:
      description: A row with the key already exists, or the email is already used by another user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: conflict
              message: a row with this key already exists
    Unavailable:
      description: The database cannot be reached or timed out.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unavailable
              message: the database is not available
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Machine-readable error code.
            message:
              type: string
    Column:
      type: object
      required:
        - name
        - type
        - kind
      properties:
        name:
          type: string
        type:
          type: string
          description: Cassandra type, for example text, int or list<text>.
        kind:
          type: string
          enum:
            - partition_key
            - clustering
            - static
            - regular
    TableInfo:
      type: object
      required:
        - name
        - columns
        - partitionKey
        - clusteringKey
        - staticColumns
        - readOnly
        - path
      properties:
        name:
          type: string
          description: Table name, used in the path.
        columns:
          type: array
          items:
            $ref: "#/components/schemas/Column"
        partitionKey:
          type: array
          items:
            type: string
        clusteringKey:
          type: array
          items:
            type: string
        staticColumns:
          type: array
          items:
            type: string
        readOnly:
          type: boolean
          description: true for lookup tables that the API maintains itself.
        derivedFrom:
          type: string
          description: For lookup tables, the table the rows are copied from.
        path:
          type: string
          description: Path template of a single row.
          example: /api/v1/shot/{project_id}/{sequence_id}/{scene_id}/{shot_id}
    Production:
      type: object
      description: Holds the production hierarchy at its top level. A production is one or more sequences, so the table has one row per sequence, partitioned by project. Reading one partition returns all sequences of a project in order.
      required:
        - project_id
        - sequence_id
      properties:
        project_id:
          type: string
          description: Identifier of the project the row belongs to (project.project_id).
        sequence_id:
          type: string
          description: Identifier of a sequence in the production. The table holds one row per sequence.
        title:
          type: string
          description: Title of the sequence.
          nullable: true
        description:
          type: string
          description: Description of the sequence.
          nullable: true
      example:
        project_id: demo
        sequence_id: SQ010
        title: Opening
        description: Example description.
    ProductionList:
      type: object
      required:
        - items
        - count
        - nextPageState
