          type: string
          description: Unique identifier of the timeline within the project.
        position:
          type: integer
          format: int32
          description: Position of the entry in the timeline. Entries are read in ascending order. Use spaced values (10, 20, 30) to leave room for insertions.
        name:
          type: string
          description: "Name of the timeline. Stored once per timeline and shared by all its entries. (static column: shared by all rows of the partition)"
          nullable: true
        description:
          type: string
          description: "Description of the timeline. Stored once per timeline and shared by all its entries. (static column: shared by all rows of the partition)"
          nullable: true
        sequence_id:
